name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing main-branch tag with a staged local build, e.g. v0.3.3"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: dauerbot-release
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # GitHub only exposes draft releases to tokens with repository push access.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Validate main-branch release tag
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          git rev-parse --verify "refs/tags/$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main
      - name: Require staged local build metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/prebuilt-macos.py inspect --tag "$RELEASE_TAG"
  macos-arm64:
    needs: preflight
    # Signing/notarization does not execute or compile the staged ARM binaries.
    runs-on: macos-15-intel
    timeout-minutes: 80
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Validate signing credentials
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          UPDATE_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE"
          test -n "$UPDATE_KEY"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test "$APPLE_TEAM_ID" = "366ADQ28F6"
      - name: Restore the verified local build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/prebuilt-macos.py restore --tag "$RELEASE_TAG"
      - name: Import Developer ID signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/dauerbot.keychain-db"
          password="$(uuidgen)"
          echo "::add-mask::$password"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign > /dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*) \([A-F0-9]\{40\}\) "Developer ID Application:.*(366ADQ28F6)".*/\1/p' | head -n 1)"
          test -n "$identity"
          ./scripts/sign-macos.sh "$PWD/dist/Dauerbot.app" "$identity" "$keychain"
      - name: Notarize, staple, and verify Gatekeeper acceptance
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python3 scripts/notarize-macos.py --keychain "$RUNNER_TEMP/dauerbot.keychain-db"
      - name: Retain notarization receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notarization-receipt
          path: dist/notarization*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Prepare signed update manifest and package
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/release-python"
          "$RUNNER_TEMP/release-python/bin/pip" install 'PyNaCl==1.6.0'
          "$RUNNER_TEMP/release-python/bin/python" scripts/prepare-release.py --tag "$RELEASE_TAG"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/publish-release.py --tag "$RELEASE_TAG"
      - name: Remove private signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/dauerbot.keychain-db" || true
          rm -f "$RUNNER_TEMP/signing.p12"
