name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-arm64
          workspaces: |
            . -> desktop/target
            desktop -> target
      - name: Install pnpm from packageManager
        run: npm install --global pnpm@12.6.0
      - name: Check frontend
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend check
      - name: Build native application
        run: ./scripts/build-desktop.sh
      - name: Backend tests and lint
        run: |
          cargo test --locked --release --target-dir desktop/target --tests
          cargo clippy --locked --release --target-dir desktop/target --all-targets -- -D warnings
      - name: Desktop tests and lint
        run: |
          cargo test --locked --release --manifest-path desktop/Cargo.toml
          cargo clippy --locked --release --manifest-path desktop/Cargo.toml --all-targets -- -D warnings
