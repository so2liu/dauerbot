[package]
name = "herdr-feishu-bridge"
version = "0.5.1"
edition = "2024"
rust-version = "1.89"
description = "A local project daemon connecting Feishu to persistent HERDR agent sessions"
license = "MIT"

[[bin]]
name = "hfb"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
axum = { version = "0.8", features = ["multipart"] }
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
chrono-tz = "0.10"
cron = "0.15"
directories = "6"
ed25519-dalek = "2.2"
fs2 = "0.4"
libc = "0.2"
openlark = { version = "=0.22.0", default-features = false, features = ["communication", "websocket"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "stream", "rustls", "system-proxy"] }
rmcp = { version = "=3.10.0", default-features = false, features = ["server", "macros", "transport-io", "schemars"] }
rusqlite = { version = "=0.42.0", features = ["bundled"] }
schemars = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "process", "io-util", "io-std", "fs", "net", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[patch.crates-io]
openlark-client = { path = "vendor/openlark-client" }
