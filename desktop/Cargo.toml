[package]
name = "herdr-bridge-desktop"
version = "0.6.11"
edition = "2024"
rust-version = "1.95"
publish = false

[[bin]]
name = "HerdrBridge"
path = "src/main.rs"

[dependencies]
anyhow = "1"
gpui = { version = "=0.2.2", default-features = false, features = ["runtime_shaders"] }
gpui-component = "=0.5.1"
gpui-terminal = { path = "vendor/gpui-terminal" }
base64 = "0.22"
iana-time-zone = "0.1"
markdown = "=1.0.0"
chrono = { version = "0.4", default-features = false, features = ["std"] }
flume = "0.12"
herdr-feishu-bridge = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "=0.42.0", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono-tz = "0.10"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
raw-window-handle = "0.6"
tray-icon = { version = "0.21", default-features = false }

[patch.crates-io]
gpui = { path = "vendor/gpui" }
openlark-client = { path = "../vendor/openlark-client" }
